name: Build and Deploy to DigitalOcean

# master (push or manual dispatch): build, push :<sha> and :latest, deploy.
# Any other branch (manual dispatch only): build only, as a CI check of the amd64 image.
# Nothing but master may push: the app runs :latest, so a pushed branch image goes live on the next
# restart, and each pushed :<sha> takes one of the two slots docr-prune keeps (TECH-689).

on:
  push:
    branches: [master]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

# Two quick merges must not race on :latest or overlap deployments.
concurrency:
  group: freebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install doctl
        if: env.IS_MASTER == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        if: env.IS_MASTER == 'true'
        run: doctl registry login --expiry-seconds 3600

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=registry.digitalocean.com/waterloocap-base-registry/freebase" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          docker build \
            --build-arg MB_EDITION=oss \
            --build-arg VERSION="v0.64.8.2-$SHA" \
            -t "$IMAGE:$SHA" \
            .

      - name: Push to DOCR
        if: env.IS_MASTER == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          docker tag "$IMAGE:$SHA" "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Deploy to DigitalOcean App Platform
        if: env.IS_MASTER == 'true'
        run: doctl apps create-deployment 015ad677-f565-4ef2-bdc1-fe1a0a35522a --wait

      - name: Branch build summary
        if: env.IS_MASTER != 'true'
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: echo "Branch build of $SHA succeeded. Not pushed or deployed; only master pushes and deploys." >> "$GITHUB_STEP_SUMMARY"
