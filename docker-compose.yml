services:
  db:
    image: postgres:16-alpine
    container_name: freebase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase_user
      POSTGRES_PASSWORD: metabase_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase_user -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  freebase:
    build:
      context: .
      args:
        MB_EDITION: oss
        VERSION: freebase-1.0
    container_name: freebase-app
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_user
      MB_DB_PASS: metabase_password
      MB_DB_HOST: db
      # Telemetry off. These replace the fork's old hardcoded getters —
      # same behavior, zero fork delta. Do NOT re-patch the source.
      MB_ANON_TRACKING_ENABLED: "false"
      MB_SNOWPLOW_AVAILABLE: "false"
      MB_CHECK_FOR_UPDATES: "false"
      # OIDC (Authentik). Set the real values in the deploy environment.
      MB_OIDC_ENABLED: "true"
      MB_OIDC_ISSUER_URI: "https://sso.waterloocap.com/application/o/metabase/"
      MB_OIDC_CLIENT_ID: "${MB_OIDC_CLIENT_ID}"
      MB_OIDC_CLIENT_SECRET: "${MB_OIDC_CLIENT_SECRET}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
